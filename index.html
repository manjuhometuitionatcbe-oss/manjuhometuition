<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eaf2ff;
            padding: 60px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
        }

        h1 {
            color: #2457c5;
        }

        button {
            background: #2457c5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome!</h1>
        <p>This is my first website.</p>
        <p>I created this website using GitHub.</p>
        <button onclick="alert('My website is working!')">
            Click Here
        </button>
    </div>
</body>
</html>
